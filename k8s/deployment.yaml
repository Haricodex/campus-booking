apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-booking
  labels:
    app: campus-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-booking
  template:
    metadata:
      labels:
        app: campus-booking
    spec:
      containers:
        - name: campus-booking
          image: ghcr.io/haricodex/campus-booking:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
