
name: Campus Booking CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:

  # 1. Security scanning using Gitleaks
  security-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Maven build and automated testing
  build:
    name: Maven Build and Test
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

  # 3. Ansible playbook validation
  ansible-validation:
    name: Ansible Playbook Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible-core==2.16.3

      - name: Validate Ansible playbook syntax
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --syntax-check

  # 4. Build and publish Docker image
  docker-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: [build, ansible-validation]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/haricodex/campus-booking:latest
            ghcr.io/haricodex/campus-booking:${{ github.sha }}

  # 5. Automatically deploy to local Minikube
  deploy-to-kubernetes:
    name: Deploy to Minikube
    runs-on: self-hosted
    needs: docker-publish
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Verify Docker and Kubernetes
        shell: powershell
        run: |
          $minikube = "C:\Program Files\Kubernetes\Minikube\minikube.exe"

          docker version
          kubectl config current-context
          kubectl get nodes

          & $minikube status
          if ($LASTEXITCODE -ne 0) {
            throw "Minikube is not running"
          }

      - name: Login to GitHub Container Registry
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          $env:GITHUB_TOKEN | docker login ghcr.io --username $env:GITHUB_ACTOR --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "GHCR login failed"
          }

      - name: Pull Docker image
        shell: powershell
        run: |
          docker pull ghcr.io/haricodex/campus-booking:${{ github.sha }}

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed"
          }

      - name: Load Docker image into Minikube
        shell: powershell
        run: |
          & "C:\Program Files\Kubernetes\Minikube\minikube.exe" image load ghcr.io/haricodex/campus-booking:${{ github.sha }}

          if ($LASTEXITCODE -ne 0) {
            throw "Minikube image load failed"
          }

      - name: Deploy updated application
        shell: powershell
        run: |
          kubectl set image deployment/campus-booking campus-booking=ghcr.io/haricodex/campus-booking:${{ github.sha }}

          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes image update failed"
          }

          kubectl rollout status deployment/campus-booking --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes rollout failed"
          }

      - name: Verify running pods
        shell: powershell
        run: |
          kubectl get pods
          kubectl get deployments
          kubectl get services

          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes resource verification failed"
          }

      - name: Test deployed application
        shell: powershell
        run: |
          $kubectl = (Get-Command kubectl.exe).Source
          $port = 18081

          $process = Start-Process -FilePath $kubectl -ArgumentList @(
            "port-forward",
            "service/campus-booking-service",
            "${port}:80"
          ) -PassThru -WindowStyle Hidden

          try {
            $success = $false

            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2

              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/status" -TimeoutSec 3

                if ($response.status -eq "running") {
                  $response | ConvertTo-Json
                  $success = $true
                  break
                }
              }
              catch {}
            }

            if (-not $success) {
              throw "Campus Booking application endpoint verification failed"
            }
          }
          finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
