---
- name: Deploy Campus Booking to Kubernetes
  hosts: local
  gather_facts: false

  tasks:
    - name: Apply Kubernetes deployment and service
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - k8s/
      register: apply_result
      changed_when: "'configured' in apply_result.stdout or 'created' in apply_result.stdout"

    - name: Display Kubernetes apply result
      ansible.builtin.debug:
        var: apply_result.stdout_lines

    - name: Verify Campus Booking deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/campus-booking
          - --timeout=120s
      changed_when: false
